[project]
name = "aqi"
version = "0.1.0"
description = "End-to-end PM2.5 forecasting system: ingestion, ML training, FastAPI serving, and monitoring."
readme = "README.md"
authors = [
    { name = "Kopal05", email = "pareekkopal41@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.5",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests that need a running PostgreSQL database"]
